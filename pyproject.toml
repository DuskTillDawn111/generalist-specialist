[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "generalist-specialist"
version = "0.2.0"
description = "A unified system for generalist/specialist deployment and request routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<3"]

[project.scripts]
gsdeploy = "gsdeploy.cli:main"

[tool.setuptools.packages.find]
include = ["gsdeploy*"]
namespaces = false
